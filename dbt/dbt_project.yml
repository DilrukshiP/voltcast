name: voltcast
version: "0.1.0"
profile: voltcast

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  voltcast:
    staging:
      # Tables, not views: the monthly files are read once when the model is built,
      # and every test then reads the table inside the warehouse.
      +materialized: table
    marts:
      +materialized: table
    features:
      +materialized: table

flags:
  send_anonymous_usage_stats: false

vars:
  # A half hour counts as a price spike when its price is above this value, in dollars per MWh.
  spike_threshold: 300
  # Up to this many half-hour steps ahead, the one-day weather forecast is used.
  # Beyond it, the two-day forecast is used. See docs/data-sources.md for the reason.
  weather_day1_max_steps: 24
