name: voltcast
version: "0.1.0"
profile: voltcast

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  voltcast:
    staging:
      # Tables, not views: the monthly files are read once when the model is built,
      # and every test then reads the table inside the warehouse.
      +materialized: table

flags:
  send_anonymous_usage_stats: false
