version: 2

models:
  - name: stg_actuals
    description: Actual prices and demand for Victoria, one row per 5-minute interval.
    columns:
      - name: region
        description: AEMO region code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["VIC1"]
      - name: interval_end
        description: End of the 5-minute interval, in market time (UTC+10, no daylight saving).
        data_tests:
          - not_null
          - unique
      - name: target_time
        description: End of the half hour that the interval belongs to.
        data_tests:
          - not_null
      - name: price_dollars_per_mwh
        description: Regional reference price for the interval.
        data_tests:
          - not_null
      - name: demand_mw
        description: Total demand in the region for the interval.
        data_tests:
          - not_null
