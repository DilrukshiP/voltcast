version: 2

models:
  - name: prices_half_hourly
    description: >
      Actual price and demand for Victoria, one row per half hour.
      This is the value that VoltCast forecasts and that every forecast is scored against.
    columns:
      - name: region
        description: AEMO region code.
        data_tests:
          - not_null
      - name: target_time
        description: End of the half hour, in market time (UTC+10, no daylight saving).
        data_tests:
          - not_null
          - unique
      - name: price_dollars_per_mwh
        description: Average of the six 5-minute prices in the half hour.
        data_tests:
          - not_null
      - name: min_price_dollars_per_mwh
        description: Lowest 5-minute price in the half hour.
        data_tests:
          - not_null
      - name: max_price_dollars_per_mwh
        description: Highest 5-minute price in the half hour.
        data_tests:
          - not_null
      - name: demand_mw
        description: Average demand over the six 5-minute intervals.
        data_tests:
          - not_null
      - name: interval_count
        description: Number of 5-minute intervals found in the half hour. It must be 6.
        data_tests:
          - not_null
